<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Row Grouping & Perfect Header Merge Control</title>
<style>
    body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; font-size: 14px; padding: 20px; color: #000; }
    table { border-collapse: collapse; width: 100%; min-width: 1000px; text-align: center; table-layout: auto; }
    th, td { border: 1px solid #777; padding: 8px 10px; vertical-align: middle; text-align: center; height: 1px; }
    th { background-color: #e7e6e6; font-weight: normal; }
    .text-left { text-align: left; }

    /* 50:50 분할 스타일 */
    .split-cell { padding: 0 !important; }
    .split-container { display: flex; flex-direction: column; height: 100%; min-height: 100%; }
    .split-item { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
    .split-item:not(:last-child) { border-bottom: 1px solid #777; }
</style>
</head>
<body>

    <div id="grid-container">로딩 중...</div>

<script>
    // 테스트하신 설정 그대로 적용
    const mappingConfig = {
        columns: [
            { key: 'cat1', name1: '대분류', name2: null, type: 'category', depth: 1, merge: true, headerMerge: true },
            { key: 'cat2', name1: '중분류', name2: null, type: 'category', depth: 2, merge: true, headerMerge: true },
            { key: 'cat3', name1: '소분류', name2: null, type: 'category', depth: 3, merge: true, headerMerge: true },
            { key: 'reviewA', name1: 'A검토', name2: 'B승인', type: 'balanced', depth: 4, merge: true, headerMerge: false },
            { key: 'reviewJ', name1: 'J검토', name2: 'J승인', type: 'balanced', depth: 4, merge: true, headerMerge: false },
            { key: 'eqName', name1: '장비', name2: null, type: 'data', depth: 5, merge: true, headerMerge: true },
            { key: 'time', name1: '타격시간', name2: null, type: 'data', depth: 5, merge: false, headerMerge: true }
        ]
    };

    const dbData = [
        { cat1: '화력', cat2: '화포', cat3: '야포', reviewA: '검토완료', reviewJ: '검토완료', eqName: '105mm 곡사포', time: '2026-08-13 10:00' },
        { cat1: '화력', cat2: '화포', cat3: '야포', reviewA: '검토완료', reviewJ: '검토완료', eqName: '155mm 곡사포', time: '2026-08-13 11:30' },
        { cat1: '화력', cat2: '화포', cat3: '야포', reviewA: '승인완료', reviewJ: '승인완료', eqName: 'K-55 자주포', time: '2026-08-13 11:50' },
        { cat1: '화력', cat2: '화포', cat3: '야포', reviewA: '승인완료', reviewJ: '승인완료', eqName: 'K-9 자주포', time: '2026-08-13 12:30' },
        { cat1: '화력1', cat2: '화포', cat3: '야포', reviewA: '승인완료', reviewJ: '승인완료', eqName: 'K-5 자주포', time: '2026-08-13 13:30' },
        { cat1: '화력1', cat2: '화포', cat3: '야포', reviewA: '승인완료', reviewJ: '승인완료', eqName: 'K-5 자주포', time: '2026-08-13 13:30' },
        { cat1: '화력2', cat2: '화포', cat3: '야포', reviewA: '검토완료', reviewJ: '검토완료', eqName: 'K-5 자주포', time: '2026-08-13 11:50' },
        { cat1: '화력2', cat2: '화포', cat3: '야포', reviewA: '검토완료', reviewJ: '검토완료', eqName: 'K-9 자주포', time: '2026-08-13 12:30' },
        { cat1: '화력2', cat2: '화포', cat3: '야포', reviewA: '승인완료', reviewJ: '승인완료', eqName: 'K-5 자주포', time: '2026-08-13 13:30' }
    ];

    class RowGroupGrid {
        constructor(containerId, config, data) {
            this.container = document.getElementById(containerId);
            this.config = config;
            this.data = data;
        }

        renderHeader() {
            const cols = this.config.columns;
            
            let headerGrid = Array.from({ length: 2 }, () => cols.map(col => ({
                text: '', rowspan: 1, colspan: 1, skip: false, headerMerge: col.headerMerge, depth: col.depth
            })));

            // 1단계: 초기 기본 텍스트 및 상하(Rowspan) 구조 정의
            cols.forEach((col, c) => {
                if (col.name2) {
                    headerGrid[0][c].text = col.name1;
                    headerGrid[1][c].text = col.name2;
                    
                    if (!col.headerMerge) {
                        headerGrid[0][c].rowspan = 1;
                        headerGrid[1][c].skip = false;
                    }
                } else {
                    headerGrid[0][c].text = col.name1;
                    
                    // [핵심 수정 부분] name2가 없는 단층 헤더도 headerMerge 설정을 타도록 수정
                    if (!col.headerMerge) {
                        headerGrid[0][c].rowspan = 1;      // 위아래 병합 해제
                        headerGrid[1][c].skip = false;     // 아래쪽 칸 생성
                        headerGrid[1][c].text = '';        // 빈 칸으로 유지
                    } else {
                        headerGrid[0][c].rowspan = 2; 
                        headerGrid[1][c].skip = true;
                    }
                }
            });

            // 2단계: 가로(Colspan) 병합 연산 처리
            for (let r = 0; r < 2; r++) {
                let mergeTarget = null;
                for (let c = 0; c < cols.length; c++) {
                    let cell = headerGrid[r][c];
                    if (cell.skip) continue;

                    if (cell.headerMerge && mergeTarget && mergeTarget.headerMerge && mergeTarget.text === cell.text && mergeTarget.depth === cell.depth) {
                        mergeTarget.colspan++;
                        cell.skip = true;
                    } else {
                        mergeTarget = cell;
                    }
                }
            }

            // 3단계: HTML 문자열 생성
            const tr1 = [], tr2 = [];
            cols.forEach((_, c) => {
                if (!headerGrid[0][c].skip) {
                    const cell = headerGrid[0][c];
                    const rowspanAttr = cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : '';
                    const colspanAttr = cell.colspan > 1 ? ` colspan="${cell.colspan}"` : '';
                    tr1.push(`<th${rowspanAttr}${colspanAttr}>${cell.text}</th>`);
                }
                if (!headerGrid[1][c].skip) {
                    const cell = headerGrid[1][c];
                    const rowspanAttr = cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : '';
                    const colspanAttr = cell.colspan > 1 ? ` colspan="${cell.colspan}"` : '';
                    tr2.push(`<th${rowspanAttr}${colspanAttr}>${cell.text}</th>`);
                }
            });

            return `<thead><tr>${tr1.join('')}</tr><tr>${tr2.join('')}</tr></thead>`;
        }

        renderBody() {
            const cols = this.config.columns;
            
            let grid = this.data.map((row, r) => cols.map((col, c) => {
                let parentValues = [];
                for (let prevC = 0; prevC < c; prevC++) {
                    if (cols[prevC].depth < col.depth) {
                        parentValues.push(row[cols[prevC].key]);
                    }
                }
                return {
                    value: row[col.key], type: col.type, depth: col.depth, merge: col.merge,
                    rowspan: 1, skip: false, parentPath: parentValues.join('|'), isSplit: false
                };
            }));

            let groups = [];
            let startIdx = 0;
            for (let i = 1; i <= grid.length; i++) {
                const prevPath = grid[i - 1][3]?.parentPath;
                const currPath = grid[i]?.[3]?.parentPath;
                if (!grid[i] || prevPath !== currPath) {
                    groups.push({ start: startIdx, end: i - 1, count: i - startIdx });
                    startIdx = i;
                }
            }

            for (let c = 0; c < cols.length; c++) {
                const colConfig = cols[c];
                if (!colConfig.merge) continue; 

                if (colConfig.type === 'category' || colConfig.type === 'data') {
                    let mergeTarget = null;
                    for (let r = 0; r < grid.length; r++) {
                        let cell = grid[r][c];
                        if (mergeTarget && mergeTarget.value === cell.value && mergeTarget.parentPath === cell.parentPath) {
                            mergeTarget.rowspan++;
                            cell.skip = true;
                        } else {
                            mergeTarget = cell;
                        }
                    }
                } 
                else if (colConfig.type === 'balanced') {
                    groups.forEach(group => {
                        let uniqueValues = [];
                        for (let r = group.start; r <= group.end; r++) {
                            const val = grid[r][c].value;
                            if (!uniqueValues.includes(val)) uniqueValues.push(val);
                        }
                        if (uniqueValues.length === 0) return;

                        const innerHtml = uniqueValues.length === 1 
                            ? uniqueValues[0] 
                            : `<div class="split-container">` + 
                              uniqueValues.map(val => `<div class="split-item">${val}</div>`).join('') +
                              `</div>`;

                        let targetCell = grid[group.start][c];
                        targetCell.value = innerHtml;
                        targetCell.rowspan = group.count;
                        targetCell.skip = false;
                        if (uniqueValues.length > 1) targetCell.isSplit = true;

                        for (let r = group.start + 1; r <= group.end; r++) {
                            grid[r][c].skip = true;
                        }
                    });
                }
            }

            const tbodyHtml = grid.map(rowCells => {
                const tds = rowCells.map((cell, c) => {
                    if (cell.skip) return '';
                    const rowspanAttr = cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : '';
                    
                    let classes = [];
                    if (c === 5) classes.push('text-left');
                    if (cell.isSplit) classes.push('split-cell');

                    const classAttr = classes.length > 0 ? ` class="${classes.join(' ')}"` : '';
                    return `<td${classAttr}${rowspanAttr}>${cell.value}</td>`;
                }).join('');
                return `<tr>${tds}</tr>`;
            }).join('');

            return `<tbody>${tbodyHtml}</tbody>`;
        }

        render() {
            this.container.innerHTML = `<table>${this.renderHeader()}${this.renderBody()}</table>`;
        }
    }

    const dataGrid = new RowGroupGrid('grid-container', mappingConfig, dbData);
    dataGrid.render();
</script>

</body>
</html>
